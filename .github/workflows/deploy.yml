script: |
            cd /home/ubuntu/Devops-demo
            
            # 1. Force the code to update
            git fetch --all
            git reset --hard origin/main
            
            # 2. Install dependencies
            npm install
            
            # 3. Completely delete the old build to ensure fresh files
            sudo rm -rf dist
            
            # 4. Build using the script we just added to package.json
            sudo npm run build
            
            # 5. Fix permissions for Nginx
            sudo chmod -R 755 /home/ubuntu/Devops-demo/dist
            
            # 6. Force Nginx to refresh its cache
            sudo systemctl reload nginx
            sudo systemctl restart nginx