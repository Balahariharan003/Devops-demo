name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 13.60.157.36
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Devops-demo
            git fetch --all
            git reset --hard origin/main
            npm install
            sudo rm -rf dist
            sudo npx expo export --platform web --clear
            sudo chmod -R 755 /home/ubuntu/Devops-demo/dist
            sudo systemctl restart nginx